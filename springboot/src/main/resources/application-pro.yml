# Production — same env-only contract as dev; split so RDS/driver specifics
# can diverge later per convention 19.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  token:
    secret: ${JWT_SECRET}
