# Production — same env-only contract as dev; split so RDS/driver specifics
# can diverge later per convention 19.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

jwt:
  token:
    secret: ${JWT_SECRET}

app:
  mail:
    enabled: true
    from: ${MAIL_USERNAME}
    from-name: Pickup & Drop
    web-base-url: ${WEB_BASE_URL:https://pickupdrop.vercel.app}
