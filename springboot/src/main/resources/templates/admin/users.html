<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}" lang="en">
<head>
  <title>Users — Admin — LandGreet</title>
</head>
<body>
<main>
  <section class="container admin-page">
    <p class="eyebrow">Admin</p>
    <h1>Users.</h1>

    <div class="card table-card">
      <table class="data-table">
        <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Joined</th>
          <th>Status</th>
          <th class="right">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}" th:classappend="${u.deleted} ? 'row-inactive'">
          <td>
            <img th:if="${u.avatarKey != null}" class="avatar avatar-sm" th:src="@{'/' + ${u.avatarKey}}" alt="">
            <span th:if="${u.avatarKey == null}" class="avatar avatar-sm avatar-fallback"
                  th:text="${#strings.substring(u.name, 0, 1)}">P</span>
          </td>
          <td>
            <span th:text="${u.name}">Name</span>
            <span class="stamp stamp-admin" th:if="${u.admin}">admin</span>
          </td>
          <td th:text="${u.email}">email</td>
          <td th:text="${u.phone} ?: '—'">phone</td>
          <td class="muted" th:text="${#strings.substring(u.createdAt, 0, 10)}">date</td>
          <td>
            <span class="stamp stamp-confirmed" th:if="${!u.deleted}">active</span>
            <span class="stamp stamp-cancelled" th:if="${u.deleted}">deactivated</span>
          </td>
          <td class="right">
            <th:block th:if="${currentUser.id != u.id}">
              <form class="inline" th:action="@{|/admin/users/${u.id}/active|}" method="post">
                <input type="hidden" name="active" th:value="${u.deleted}">
                <button class="btn btn-ghost btn-sm" type="submit"
                        th:text="${u.deleted} ? 'Reactivate' : 'Deactivate'">Deactivate</button>
              </form>
              <form class="inline" th:if="${!u.deleted}" th:action="@{|/admin/users/${u.id}/admin|}" method="post">
                <input type="hidden" name="admin" th:value="${!u.admin}">
                <button class="btn btn-ghost btn-sm" type="submit"
                        th:text="${u.admin} ? 'Remove admin' : 'Make admin'">Make admin</button>
              </form>
            </th:block>
            <span class="muted small" th:if="${currentUser.id == u.id}">you</span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
