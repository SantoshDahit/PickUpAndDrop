<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, main)" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">LandGreet</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header">
  <div class="container header-row">
    <a class="brand" th:href="@{/}">LandGreet</a>
    <nav class="header-nav">
      <th:block th:if="${currentUser != null}">
        <a class="nav-link" th:href="@{/trips}">My trips</a>
        <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Admin</a>
        <a class="nav-user" th:href="@{/account}">
          <img th:if="${currentUser.avatarKey != null}" class="avatar avatar-sm"
               th:src="@{'/' + ${currentUser.avatarKey}}" alt="">
          <span th:if="${currentUser.avatarKey == null}" class="avatar avatar-sm avatar-fallback"
                th:text="${#strings.substring(currentUser.name, 0, 1)}">P</span>
          <span th:text="${currentUser.name}">Name</span>
        </a>
        <form class="inline" th:action="@{/logout}" method="post">
          <button class="btn btn-ghost btn-sm" type="submit">Log out</button>
        </form>
      </th:block>
      <th:block th:if="${currentUser == null}">
        <a class="nav-link" th:href="@{/login}">Log in</a>
        <a class="btn btn-primary btn-sm" th:href="@{/signup}">Sign up</a>
      </th:block>
    </nav>
  </div>
</header>

<div class="container flash-zone" th:if="${ok != null or error != null}">
  <div class="notice-ok" th:if="${ok}" th:text="${ok}"></div>
  <div class="notice-error" th:if="${error}" th:text="${error}"></div>
</div>

<main th:replace="${main}"></main>

<footer class="site-footer">
  <div class="container">
    <span class="muted">LandGreet — airport pickups anywhere in Korea. You land, we greet you. Fixed fares, cash on arrival.</span>
  </div>
</footer>
</body>
</html>
