<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}" lang="en">
<head>
  <title>Log in — LandGreet</title>
</head>
<body>
<main>
  <section class="container auth-panel">
    <p class="eyebrow">Log in</p>
    <h1>Welcome back.</h1>
    <p class="muted">Check on your trips or book the next pickup.</p>

    <div class="notice-error" th:if="${param.error != null}">Email or password didn't match.</div>
    <div class="notice-ok" th:if="${param.logout != null}">You're logged out.</div>

    <form class="card form-card" th:action="@{/login}" method="post">
      <div class="field">
        <label class="field-label" for="username">Email</label>
        <input class="field-input" type="email" id="username" name="username"
               placeholder="you@example.com" required autofocus>
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" type="password" id="password" name="password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>

    <p class="muted center">First time here? <a th:href="@{/signup}">Create an account</a></p>
  </section>
</main>
</body>
</html>
