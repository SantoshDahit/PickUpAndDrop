# Testing/dev server — every secret comes from the environment; no defaults,
# so a missing variable fails the boot instead of silently using a weak value.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

jwt:
  token:
    secret: ${JWT_SECRET}

app:
  mail:
    # Gmail ignores a From that isn't the authenticated account, so send as it.
    enabled: true
    from: ${MAIL_USERNAME}
    from-name: Pickup & Drop
    web-base-url: ${WEB_BASE_URL:https://pickupdrop.vercel.app}
