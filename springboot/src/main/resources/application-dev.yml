# Testing/dev server — every secret comes from the environment; no defaults,
# so a missing variable fails the boot instead of silently using a weak value.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  token:
    secret: ${JWT_SECRET}
