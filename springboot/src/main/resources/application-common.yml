spring:
  jpa:
    # Schema is owned by Flyway; SQLite-era note gone — validate stays off
    # because MySQL enum/char mappings are asserted by the test suite instead.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
