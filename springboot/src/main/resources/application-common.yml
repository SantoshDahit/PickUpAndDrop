spring:
  datasource:
    hikari:
      # Pin the DB session zone to match the JVM and hibernate.jdbc.time_zone.
      # Without this, a server session in another zone shifts DATE values by a
      # day (a booking for the 15th read back as the 14th), which would also
      # move travellers into the wrong landing-week bucket.
      connection-init-sql: "SET time_zone = '+09:00'"

  jpa:
    # Schema is owned by Flyway; SQLite-era note gone — validate stays off
    # because MySQL enum/char mappings are asserted by the test suite instead.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
