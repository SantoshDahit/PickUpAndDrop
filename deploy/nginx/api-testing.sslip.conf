# Testing phase: replace 1.2.3.4 with your Contabo IP (dots kept).
# api.1.2.3.4.sslip.io resolves to 1.2.3.4 automatically — no DNS setup,
# and certbot can issue a real Let's Encrypt certificate for it.
server {
    listen 80;
    server_name api.1.2.3.4.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
