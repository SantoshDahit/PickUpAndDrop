# API deploy — Blue-Green per springboot/conventions/18-deployment-convention.md
# Split into build → deploy jobs; image tag {user}/{project}-api:{profile}.{YYYY.MM.DD}.
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "springboot/**"
      - "deploy/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  PROFILE: dev
  PROJECT_NAME: pickupdrop
  APPLICATION_NAME: api
  CONTAINER_PORT: 8080
  BLUE_PORT_HOST: 18080          # host ports; avoid clashing with other projects
  GREEN_PORT_HOST: 18081
  DOMAIN: api.217.15.165.238.sslip.io
  DOCKER_NETWORK: restaurant-network      # shared-mysql lives here
  CADDYFILE: /home/deploy/Caddyfile      # mounted into the caddy container

jobs:
  # ---------------------------------------------------------------- build
  build:
    runs-on: ubuntu-latest
    outputs:
      # Only the non-secret tag suffix crosses jobs: GitHub redacts job outputs
      # that contain secret values, which would arrive empty in `deploy`.
      tag_date: ${{ steps.image.outputs.tag_date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Convention 18 Phase 1: build. The suite runs in ci.yml on every push,
      # so the deploy path stays fast without shipping untested code.
      - name: Gradle build
        working-directory: springboot
        run: ./gradlew clean build -x test

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        id: image
        run: |
          TAG_DATE="${PROFILE}.$(date +%Y.%m.%d)"
          echo "tag_date=$TAG_DATE" >> "$GITHUB_OUTPUT"
          TAG="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${APPLICATION_NAME}:${TAG_DATE}"
          docker build -t "$TAG" springboot
          docker push "$TAG"
          echo "pushed ${PROJECT_NAME}-${APPLICATION_NAME}:${TAG_DATE}"

  # --------------------------------------------------------------- deploy
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fail early on missing runtime secrets
        run: |
          missing=""
          [ -n "${{ secrets.DB_URL }}" ]      || missing="$missing DB_URL"
          [ -n "${{ secrets.DB_USERNAME }}" ] || missing="$missing DB_USERNAME"
          [ -n "${{ secrets.DB_PASSWORD }}" ] || missing="$missing DB_PASSWORD"
          [ -n "${{ secrets.JWT_SECRET }}" ]  || missing="$missing JWT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing — the container would crash-loop on startup"
            exit 1
          fi
          echo "all runtime secrets present"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # keepalive: the health gate can hold the session idle for minutes
          printf 'Host *\n  ServerAliveInterval 20\n  ServerAliveCountMax 30\n  TCPKeepAlive yes\n' >> ~/.ssh/config

      # Phases 2-6 on the server: detect colour → start new → health gate →
      # Caddy flip → retire old. Secrets are injected as container env vars.
      - name: Blue-Green deploy
        run: |
          # Rebuild the tag here: the username is a secret (masked in logs) and
          # the date came through the job output.
          TAG_DATE='${{ needs.build.outputs.tag_date }}'
          [ -n "$TAG_DATE" ] || { echo "::error::empty tag from the build job"; exit 1; }
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${APPLICATION_NAME}:${TAG_DATE}"
          echo "deploying image tag suffix: ${TAG_DATE}"
          # Secrets travel base64-encoded: quoting/newlines in a pasted secret
          # can silently corrupt the value on the way through ssh.
          b64() { printf '%s' "$1" | tr -d '\r\n' | base64 | tr -d '\n'; }
          DB_URL_B64=$(b64 '${{ secrets.DB_URL }}')
          DB_USERNAME_B64=$(b64 '${{ secrets.DB_USERNAME }}')
          DB_PASSWORD_B64=$(b64 '${{ secrets.DB_PASSWORD }}')
          JWT_SECRET_B64=$(b64 '${{ secrets.JWT_SECRET }}')
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "IMAGE_TAG='$IMAGE_TAG' PROFILE='$PROFILE' \
             DB_URL_B64='$DB_URL_B64' DB_USERNAME_B64='$DB_USERNAME_B64' \
             DB_PASSWORD_B64='$DB_PASSWORD_B64' JWT_SECRET_B64='$JWT_SECRET_B64' \
             CORS_ALLOWED_ORIGINS='${{ vars.CORS_ALLOWED_ORIGINS }}' \
             PROJECT_NAME='$PROJECT_NAME' APPLICATION_NAME='$APPLICATION_NAME' \
             CONTAINER_PORT='$CONTAINER_PORT' BLUE_PORT='$BLUE_PORT_HOST' GREEN_PORT='$GREEN_PORT_HOST' \
             DOMAIN='$DOMAIN' DOCKER_NETWORK='$DOCKER_NETWORK' CADDYFILE='$CADDYFILE' bash -s" <<'REMOTE'
          set -euo pipefail
          # Trim surrounding whitespace: pasted secrets often carry a stray
          # leading/trailing space, which silently corrupts URLs and passwords.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          DB_URL=$(trim "$(printf '%s' "$DB_URL_B64" | base64 -d)")
          DB_USERNAME=$(trim "$(printf '%s' "$DB_USERNAME_B64" | base64 -d)")
          DB_PASSWORD_RAW=$(printf '%s' "$DB_PASSWORD_B64" | base64 -d)
          DB_PASSWORD=$(trim "$DB_PASSWORD_RAW")
          [ "${#DB_PASSWORD}" = "${#DB_PASSWORD_RAW}" ] \
            || echo "::warning::DB_PASSWORD had surrounding whitespace — trimmed"
          JWT_SECRET=$(trim "$(printf '%s' "$JWT_SECRET_B64" | base64 -d)")

          case "$DB_URL" in
            jdbc:mysql://*) ;;
            *) echo "::error::DB_URL must start with jdbc:mysql:// (received ${#DB_URL} chars)"; exit 1 ;;
          esac

          # Phase 0: prove the DB credentials work before deploying anything.
          # Values are printed in [brackets] with lengths: GitHub masks secret
          # values as ***, so shapes are what actually tell us what is wrong.
          DB_HOST=$(printf '%s' "$DB_URL" | sed -E 's#^jdbc:mysql://([^:/]+).*#\1#')
          DB_PORT=$(printf '%s' "$DB_URL" | sed -E 's#^jdbc:mysql://[^:]+:([0-9]+).*#\1#')
          DB_NAME=$(printf '%s' "$DB_URL" | sed -E 's#^jdbc:mysql://[^/]+/([^?]+).*#\1#')
          case "$DB_PORT" in ''|*[!0-9]*) DB_PORT=3306 ;; esac
          echo "db check: host=[${DB_HOST}] port=[${DB_PORT}] db=[${DB_NAME}]"
          echo "  lengths: url=${#DB_URL} host=${#DB_HOST} db=${#DB_NAME} user=${#DB_USERNAME} pass=${#DB_PASSWORD}"
          set +e
          DBERR=$(docker run --rm --network "$DOCKER_NETWORK" mysql:8.0 \
                    mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" -p"$DB_PASSWORD" \
                    -e 'SELECT 1' "$DB_NAME" 2>&1)
          DBRC=$?
          set -e
          if [ "$DBRC" -ne 0 ]; then
            echo "::error::db check failed (exit ${DBRC})"
            # bash replacement, not sed: passwords may contain / and other
            # characters that break a sed s### expression
            printf '%s\n' "${DBERR//${DB_PASSWORD}/REDACTED}" | tail -6
            echo "--- what the message means ---"
            echo "  'Access denied'          → the MySQL user/password differs from the secrets"
            echo "  'Unknown MySQL server'   → DB_URL host is wrong (must be the container name, e.g. shared-mysql)"
            echo "  \"Can't connect\"          → host resolves but nothing is listening on that port"
            exit 1
          fi
          echo "db credentials OK"

          docker pull "$IMAGE_TAG"

          BLUE_CONTAINER="${PROJECT_NAME}-${APPLICATION_NAME}-${PROFILE}-BLUE"
          GREEN_CONTAINER="${PROJECT_NAME}-${APPLICATION_NAME}-${PROFILE}-GREEN"

          # Phase 2: detect the active colour. "Active" means actually serving —
          # a crash-looping container is treated as dead so we don't flip to it.
          healthy() {
            local name="$1" port="$2"
            docker ps --format '{{.Names}}' | grep -q "^${name}$" || return 1
            [ "$(docker inspect -f '{{.RestartCount}}' "$name" 2>/dev/null || echo 99)" -lt 3 ] || return 1
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${port}/actuator/health/liveness")" = "200" ]
          }
          if healthy "$BLUE_CONTAINER" "$BLUE_PORT"; then
            NEW_COLOR="GREEN"; NEW_PORT=$GREEN_PORT; NEW_CONTAINER=$GREEN_CONTAINER
            OLD_PORT=$BLUE_PORT; OLD_CONTAINER=$BLUE_CONTAINER
          elif healthy "$GREEN_CONTAINER" "$GREEN_PORT"; then
            NEW_COLOR="BLUE"; NEW_PORT=$BLUE_PORT; NEW_CONTAINER=$BLUE_CONTAINER
            OLD_PORT=$GREEN_PORT; OLD_CONTAINER=$GREEN_CONTAINER
          else
            # nothing is serving (first deploy, or previous attempts are looping):
            # clear both colours and start clean on BLUE
            echo "no healthy container — clearing stale colours"
            for c in "$BLUE_CONTAINER" "$GREEN_CONTAINER"; do
              docker rm -f "$c" 2>/dev/null || true
            done
            NEW_COLOR="BLUE"; NEW_PORT=$BLUE_PORT; NEW_CONTAINER=$BLUE_CONTAINER
            OLD_PORT=$GREEN_PORT; OLD_CONTAINER=$GREEN_CONTAINER
          fi
          echo "deploying to ${NEW_COLOR} (:${NEW_PORT})"

          # Phase 3: start the new colour (old one keeps serving).
          # Runtime secrets come from GitHub Actions secrets — nothing sensitive
          # is stored on the server, and nothing is committed.
          EXTRA_ENV=()
          [ -n "${CORS_ALLOWED_ORIGINS:-}" ] && EXTRA_ENV+=(-e "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}")
          docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
          docker run -d --name "$NEW_CONTAINER" \
            --network "$DOCKER_NETWORK" \
            -p 127.0.0.1:${NEW_PORT}:${CONTAINER_PORT} \
            -e "SPRING_PROFILES_ACTIVE=${PROFILE}" \
            -e "DB_URL=${DB_URL}" \
            -e "DB_USERNAME=${DB_USERNAME}" \
            -e "DB_PASSWORD=${DB_PASSWORD}" \
            -e "JWT_SECRET=${JWT_SECRET}" \
            "${EXTRA_ENV[@]}" \
            --restart on-failure:2 \
            "$IMAGE_TAG"

          # Phase 4: health gate. Prints every attempt so the SSH session never
          # goes idle, and bails the moment the app crash-loops.
          HEALTH_URL="http://localhost:${NEW_PORT}/actuator/health/liveness"
          for i in $(seq 1 60); do
            RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$NEW_CONTAINER" 2>/dev/null || echo 0)
            RUNNING=$(docker inspect -f '{{.State.Running}}' "$NEW_CONTAINER" 2>/dev/null || echo false)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            echo "  attempt ${i}/60: http=${STATUS} running=${RUNNING} restarts=${RESTARTS}"
            [ "$STATUS" = "200" ] && { echo "health check passed"; break; }
            if [ "$RUNNING" != "true" ] || [ "$RESTARTS" -ge 2 ]; then
              echo "::error::container is not staying up — application startup failed"
              docker logs --tail 60 "$NEW_CONTAINER" || true
              docker rm -f "$NEW_CONTAINER" || true
              exit 1
            fi
            if [ "$i" = "60" ]; then
              echo "::error::health check timed out"
              docker logs --tail 60 "$NEW_CONTAINER" || true
              docker rm -f "$NEW_CONTAINER" || true
              exit 1
            fi
            sleep 5
          done

          # Phase 5: Caddy traffic flip (validated, reverted on failure).
          # Caddy owns 80/443 and its own TLS — the flip is a config reload.
          # awk (not sed) so only our site block changes; verified on Linux.
          cp "$CADDYFILE" "${CADDYFILE}.bak"
          awk -v dom="$DOMAIN" -v port="$NEW_PORT" '
            index($0, dom" {") == 1 { inblock = 1 }
            inblock && /reverse_proxy 127\.0\.0\.1:[0-9]+/ { sub(/127\.0\.0\.1:[0-9]+/, "127.0.0.1:" port) }
            /^}/ { inblock = 0 }
            { print }
          ' "${CADDYFILE}.bak" > "$CADDYFILE"
          grep -A1 "^${DOMAIN} {" "$CADDYFILE" | grep -q ":${NEW_PORT}" \
            || { echo "::error::caddyfile flip did not apply"; cp "${CADDYFILE}.bak" "$CADDYFILE"; \
                 docker rm -f "$NEW_CONTAINER" || true; exit 1; }
          if docker exec caddy caddy validate --config /etc/caddy/Caddyfile 2>/dev/null \
             && docker exec caddy caddy reload --config /etc/caddy/Caddyfile; then
            echo "caddy now proxying :${NEW_PORT}"
          else
            cp "${CADDYFILE}.bak" "$CADDYFILE"
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile || true
            docker rm -f "$NEW_CONTAINER" || true
            exit 1
          fi

          # Phase 6: retire the old colour + cleanup
          sleep 10
          docker rm -f "$OLD_CONTAINER" 2>/dev/null || true
          docker rm -f "${PROJECT_NAME}-${APPLICATION_NAME}-${PROFILE}" 2>/dev/null || true
          docker images -f "dangling=true" -q | xargs -r docker rmi -f || true
          # convention 18: drop older-dated local images of this app, keep the running one
          REPO="${IMAGE_TAG%%:*}"
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "^${REPO}:${PROFILE}\." | grep -v "^${IMAGE_TAG}$" \
            | xargs -r docker rmi -f 2>/dev/null || true
          echo "switched to ${NEW_COLOR}"
          REMOTE

      - name: Verify public endpoint
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://${DOMAIN}/v1/routes" || echo 000)
            echo "  public check ${i}: ${CODE}"
            [ "$CODE" = "200" ] && { echo "https://${DOMAIN} is live"; exit 0; }
            sleep 5
          done
          echo "::error::public endpoint not returning 200"; exit 1
