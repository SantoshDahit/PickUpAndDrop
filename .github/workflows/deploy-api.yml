# API deploy — Blue-Green per springboot/conventions/18-deployment-convention.md
# Docker Hub tag: {DOCKER_HUB_USERNAME}/{PROJECT}-{APP}:{PROFILE}.{YYYY.MM.DD}
# Containers:     {PROJECT}-{APP}-{PROFILE}-BLUE / -GREEN, nginx port flip, zero downtime.
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "springboot/**"
      - "deploy/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  PROFILE: dev
  PROJECT_NAME: pickupdrop
  APPLICATION_NAME: api
  CONTAINER_PORT: 8080
  BLUE_PORT_HOST: 18080          # host ports; avoid clashing with other projects
  GREEN_PORT_HOST: 18081
  DOMAIN: api.217.15.165.238.sslip.io
  # Existing shared infrastructure on the box
  DOCKER_NETWORK: restaurant-network      # shared-mysql lives here
  CADDYFILE: /home/deploy/Caddyfile      # mounted into the caddy container

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Convention 18 Phase 1: build (tests are covered on PR/branch runs)
      - name: Gradle build
        working-directory: springboot
        run: ./gradlew clean build -x test

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        id: image
        run: |
          TAG="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${APPLICATION_NAME}:${PROFILE}.$(date +%Y.%m.%d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          docker build -t "$TAG" springboot
          docker push "$TAG"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Phases 2-6 on the server: detect color → start new → health gate →
      # nginx flip → retire old. Runtime secrets stay in /opt/pickupdrop/.env.
      - name: Blue-Green deploy
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "IMAGE_TAG='${{ steps.image.outputs.tag }}' PROFILE='$PROFILE' \
             DB_URL='${{ secrets.DB_URL }}' DB_USERNAME='${{ secrets.DB_USERNAME }}' \
             DB_PASSWORD='${{ secrets.DB_PASSWORD }}' JWT_SECRET='${{ secrets.JWT_SECRET }}' \
             CORS_ALLOWED_ORIGINS='${{ vars.CORS_ALLOWED_ORIGINS }}' \
             PROJECT_NAME='$PROJECT_NAME' APPLICATION_NAME='$APPLICATION_NAME' \
             CONTAINER_PORT='$CONTAINER_PORT' BLUE_PORT='$BLUE_PORT_HOST' GREEN_PORT='$GREEN_PORT_HOST' \
             DOMAIN='$DOMAIN' DOCKER_NETWORK='$DOCKER_NETWORK' CADDYFILE='$CADDYFILE' bash -s" <<'REMOTE'
          set -euo pipefail
          docker pull "$IMAGE_TAG"

          BLUE_CONTAINER="${PROJECT_NAME}-${APPLICATION_NAME}-${PROFILE}-BLUE"
          GREEN_CONTAINER="${PROJECT_NAME}-${APPLICATION_NAME}-${PROFILE}-GREEN"

          # Phase 2: detect the active colour
          if docker ps --format '{{.Names}}' | grep -q "^${BLUE_CONTAINER}$"; then
            NEW_COLOR="GREEN"; NEW_PORT=$GREEN_PORT; NEW_CONTAINER=$GREEN_CONTAINER
            OLD_PORT=$BLUE_PORT; OLD_CONTAINER=$BLUE_CONTAINER
          elif docker ps --format '{{.Names}}' | grep -q "^${GREEN_CONTAINER}$"; then
            NEW_COLOR="BLUE"; NEW_PORT=$BLUE_PORT; NEW_CONTAINER=$BLUE_CONTAINER
            OLD_PORT=$GREEN_PORT; OLD_CONTAINER=$GREEN_CONTAINER
          else
            NEW_COLOR="BLUE"; NEW_PORT=$BLUE_PORT; NEW_CONTAINER=$BLUE_CONTAINER
            OLD_PORT=$GREEN_PORT; OLD_CONTAINER=$GREEN_CONTAINER
          fi
          echo "deploying to ${NEW_COLOR} (:${NEW_PORT})"

          # Phase 3: start the new colour (old one keeps serving).
          # Runtime secrets come from GitHub Actions secrets — nothing sensitive
          # is stored on the server, and nothing is committed.
          EXTRA_ENV=()
          [ -n "${CORS_ALLOWED_ORIGINS:-}" ] && EXTRA_ENV+=(-e "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}")
          docker stop "$NEW_CONTAINER" 2>/dev/null || true
          docker rm "$NEW_CONTAINER" 2>/dev/null || true
          docker run -d --name "$NEW_CONTAINER" \
            --network "$DOCKER_NETWORK" \
            -p 127.0.0.1:${NEW_PORT}:${CONTAINER_PORT} \
            -e "SPRING_PROFILES_ACTIVE=${PROFILE}" \
            -e "DB_URL=${DB_URL}" \
            -e "DB_USERNAME=${DB_USERNAME}" \
            -e "DB_PASSWORD=${DB_PASSWORD}" \
            -e "JWT_SECRET=${JWT_SECRET}" \
            "${EXTRA_ENV[@]}" \
            --restart always \
            "$IMAGE_TAG"

          # Phase 4: health gate (liveness), rollback on failure
          HEALTH_URL="http://localhost:${NEW_PORT}/actuator/health/liveness"
          MAX_RETRIES=30; RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            if ! docker ps --format '{{.Names}}' | grep -q "^${NEW_CONTAINER}$"; then
              echo "container died"; docker logs "$NEW_CONTAINER" | tail -40 || true; exit 1
            fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            [ "$STATUS" = "200" ] && { echo "health check passed"; break; }
            if [ "$i" = "$MAX_RETRIES" ]; then
              echo "health check failed — rolling back"
              docker logs "$NEW_CONTAINER" | tail -40 || true
              docker stop "$NEW_CONTAINER" || true
              docker rm "$NEW_CONTAINER" || true
              exit 1
            fi
            sleep $RETRY_INTERVAL
          done

          # Phase 5: Caddy traffic flip (validated, reverted on failure).
          # Caddy owns 80/443 and its own TLS — the flip is a config reload.
          # awk (not sed) so only our site block changes; verified on Linux.
          cp "$CADDYFILE" "${CADDYFILE}.bak"
          awk -v dom="$DOMAIN" -v port="$NEW_PORT" '
            index($0, dom" {") == 1 { inblock = 1 }
            inblock && /reverse_proxy 127\.0\.0\.1:[0-9]+/ { sub(/127\.0\.0\.1:[0-9]+/, "127.0.0.1:" port) }
            /^}/ { inblock = 0 }
            { print }
          ' "${CADDYFILE}.bak" > "$CADDYFILE"
          grep -A1 "^${DOMAIN} {" "$CADDYFILE" | grep -q ":${NEW_PORT}" \
            || { echo "caddyfile flip did not apply"; cp "${CADDYFILE}.bak" "$CADDYFILE"; \
                 docker stop "$NEW_CONTAINER" || true; docker rm "$NEW_CONTAINER" || true; exit 1; }
          if docker exec caddy caddy validate --config /etc/caddy/Caddyfile 2>/dev/null \
             && docker exec caddy caddy reload --config /etc/caddy/Caddyfile; then
            echo "caddy now proxying :${NEW_PORT}"
          else
            cp "${CADDYFILE}.bak" "$CADDYFILE"
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile || true
            docker stop "$NEW_CONTAINER" || true
            docker rm "$NEW_CONTAINER" || true
            exit 1
          fi

          # Phase 6: retire the old colour + cleanup
          sleep 10
          docker stop "$OLD_CONTAINER" 2>/dev/null || true
          docker rm "$OLD_CONTAINER" 2>/dev/null || true
          docker stop "${PROJECT_NAME}-${APPLICATION_NAME}-${PROFILE}" 2>/dev/null || true
          docker rm "${PROJECT_NAME}-${APPLICATION_NAME}-${PROFILE}" 2>/dev/null || true
          docker images -f "dangling=true" -q | xargs -r docker rmi -f || true
          echo "switched to ${NEW_COLOR}"
          REMOTE
